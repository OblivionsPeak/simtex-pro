<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>shader compile test</title></head>
<body><pre id="out">running...</pre>
<script type="module">
import { buildHelperPrelude } from './src/engine/ShaderEngine.js';

const out = document.getElementById('out');
const listing = await (await fetch('./src/engine/patterns/')).text();
const files = [...listing.matchAll(/href="([^"]+\.js)"/g)].map(m => m[1]);

const canvas = document.createElement('canvas');
const gl = canvas.getContext('webgl');
if (!gl) { out.textContent = 'NO WEBGL'; }
else {
  const fails = [];
  let n = 0;
  for (const f of files) {
    const p = (await import(`./src/engine/patterns/${f}`)).default;
    let src = 'precision highp float;\nvarying vec2 v_uv;\nuniform vec2 u_resolution;\nuniform float u_time;\nuniform float u_is_spec;\nuniform float u_opacity;\n';
    p.uniforms.forEach(u => {
      src += (u.type === 'color' ? `uniform vec4 ${u.id};\n` : `uniform float ${u.id};\n`);
    });
    src += buildHelperPrelude(p.shader) + p.shader;
    src += p.shader.includes('u_is_spec')
      ? '\nvoid main(){vec4 r=generate();gl_FragColor=vec4(r.rgb,r.a*u_opacity);}'
      : '\nvoid main(){vec4 r=generate();if(u_is_spec>0.5){float l=dot(r.rgb,vec3(0.299,0.587,0.114));r=vec4(0.0,clamp(1.0-l*0.85,0.05,0.95),0.0,r.a);}gl_FragColor=vec4(r.rgb,r.a*u_opacity);}';
    const sh = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      fails.push(f + ' :: ' + gl.getShaderInfoLog(sh).split('\n').slice(0, 4).join(' | '));
    }
    gl.deleteShader(sh);
    n++;
  }
  out.textContent = `CHECKED ${n}\nFAILS ${fails.length}\n` + fails.join('\n');
}
</script></body></html>
